name: Dependency Check

"on":
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Cold NVD downloads can exceed 45m when the cache misses; keep headroom once cache works.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ISO week stamp so NVD data is refreshed about weekly without forcing a cold download every run.
      - name: Compute NVD cache week key
        id: nvd-week
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      # Cache the actual Dependency-Check data (NVD cache + embedded DB).
      # Do NOT put github.run_id in the key — that made every run a cold NVD download and caused
      # frequent 45m cancellations after #94 traded reuse for crash-avoidance.
      # save-always: CVSS gate failures (exit 1) must still persist a healthy NVD DB for the next run.
      - name: Cache Dependency-Check data
        uses: actions/cache@v5
        with:
          path: ~/.dependency-check/data
          key: dependency-check-data-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}-
            dependency-check-data-${{ runner.os }}-
          save-always: true

      # If a previous run left a corrupt H2 MVStore file, remove it so the tool
      # starts fresh rather than crashing with ClosedChannelException / connectionPool null.
      - name: Clear dependency-check data if H2 database is corrupt
        run: |
          DC_DATA="$HOME/.dependency-check/data"
          if [ -d "$DC_DATA" ]; then
            # H2 MVStore files use the .mv.db extension; check for zero-length or clearly
            # truncated files (size < 4 KB) which indicate an interrupted prior write.
            find "$DC_DATA" -name "*.mv.db" | while read db; do
              size=$(wc -c < "$db" 2>/dev/null || echo 0)
              if [ "$size" -lt 4096 ]; then
                echo "Removing suspect DB file: $db (size=${size})"
                rm -rf "$DC_DATA"
                break
              fi
            done
          fi

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -DskipTests dependency-check:check \
            -Ddependency-check.data.directory="$HOME/.dependency-check/data" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DnvdApiDelay=2000

      # Only wipe the data dir when the scan failed BEFORE producing a report (infra/NVD/update
      # crash). CVSS gate failures still produce HTML — keep that healthy DB for the next cache save.
      - name: Clear dependency-check data on infra failure
        if: failure() && hashFiles('target/dependency-check-report.html') == ''
        run: rm -rf "$HOME/.dependency-check/data"

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
